<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Presentes</title>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #9cb071;
            --text-color: #ffffff;
            --card-bg: #f0ede1;
            --btn-color: #c48b5d;
        }
        body {
            margin: 0;
            padding: 0 20px 20px 20px;
            background-color: var(--bg-color);
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            font-family: 'Quicksand', sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .flower { position: absolute; width: 250px; opacity: 0.9; pointer-events: none; z-index: 0; }
        .flower.top-left { top: -20px; left: -20px; transform: rotate(15deg); }
        .flower.top-right { top: -20px; right: -20px; transform: scaleX(-1) rotate(15deg); }
        .sparkle { position: absolute; width: 25px; animation: pulse 2s infinite alternate; pointer-events: none; z-index: 0; }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.2); opacity: 1; } }

        h1 {
            font-family: 'Amatic SC', cursive;
            font-size: 4rem;
            margin: 60px 0 30px 0;
            text-align: center;
            z-index: 1;
            position: relative;
            letter-spacing: 2px;
        }
        .grid-presentes {
            z-index: 1;
            position: relative;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 40px;
        }
        .card {
            background-color: var(--card-bg); color: #555; padding: 20px; border-radius: 15px; text-align: center;
            box-shadow: 0 6px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.3s ease;
        }
        .card h3 { margin: 10px 0; font-size: 1.3rem; color: #7a8a58; font-weight: 700; }
        .card p { margin: 5px 0 15px 0; font-size: 0.95rem; }
        .btn-presentear {
            background-color: var(--btn-color); color: white; border: none; padding: 12px; border-radius: 20px;
            font-weight: 700; cursor: pointer; text-transform: uppercase; font-family: 'Quicksand', sans-serif;
        }
        .btn-voltar { z-index: 1; position: relative; color: white; text-decoration: none; font-weight: 700; border-bottom: 2px solid white; padding-bottom: 2px; margin-bottom: 30px; text-transform: uppercase; }

        /* --- RESPONSIVIDADE (CELULAR) --- */
        @media (max-width: 600px) {
            .flower { width: 150px; }
            h1 { font-size: 3rem; margin-top: 80px; }
            .grid-presentes { grid-template-columns: 1fr; } /* Garante 1 coluna no celular */
        }
    </style>
</head>
<body>
    <svg class="flower top-left" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path d="M-20 -20 Q100 50 160 180" stroke="#87995e" stroke-width="2" fill="none"/>
        <path d="M20 10 Q120 40 100 150" stroke="#87995e" stroke-width="2" fill="none"/>
        <circle cx="160" cy="180" r="15" fill="#f7f5ed" opacity="0.9"/>
        <circle cx="145" cy="165" r="12" fill="#e8e4d3" opacity="0.9"/>
        <circle cx="175" cy="165" r="10" fill="#f7f5ed" opacity="0.9"/>
    </svg>
    <svg class="flower top-right" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path d="M-20 -20 Q100 50 160 180" stroke="#87995e" stroke-width="2" fill="none"/>
        <path d="M20 10 Q120 40 100 150" stroke="#87995e" stroke-width="2" fill="none"/>
        <circle cx="160" cy="180" r="15" fill="#f7f5ed" opacity="0.9"/>
        <circle cx="145" cy="165" r="12" fill="#e8e4d3" opacity="0.9"/>
        <circle cx="175" cy="165" r="10" fill="#f7f5ed" opacity="0.9"/>
    </svg>

    <svg class="sparkle" style="top: 15%; left: 8%;" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 0 Q50 50 100 50 Q50 50 50 100 Q50 50 0 50 Q50 50 50 0 Z" fill="#fff"/></svg>
    
    <h1>Lista de Presentes</h1>
    
    <div class="grid-presentes">
        <div class="card">
            <h3>Jogo de Panelas</h3>
            <p>Tamanho padrão, cor neutra.</p>
            <button class="btn-presentear" onclick="escolherPresente('Jogo de Panelas')">Escolher</button>
        </div>
        <div class="card">
            <h3>Liquidificador</h3>
            <p>110v, qualquer marca.</p>
            <button class="btn-presentear" onclick="escolherPresente('Liquidificador')">Escolher</button>
        </div>
        <div class="card">
            <h3>Jogo de Cama</h3>
            <p>Tamanho Casal Queen.</p>
            <button class="btn-presentear" onclick="escolherPresente('Jogo de Cama')">Escolher</button>
        </div>
        <div class="card">
            <h3>Faqueiro</h3>
            <p>Inox, uso diário.</p>
            <button class="btn-presentear" onclick="escolherPresente('Faqueiro')">Escolher</button>
        </div>
    </div>

    <a href="index.html" class="btn-voltar">← Voltar para o Convite</a>

    <script>
        function escolherPresente(item) {
            const seuWhatsApp = "5511900000000"; // INSIRA SEU NÚMERO AQUI
            const mensagem = `Olá! Estava olhando a lista do Chá de Panela e escolhi te presentear com: *${item}*! ✨`;
            window.open(`https://wa.me/${seuWhatsApp}?text=${encodeURIComponent(mensagem)}`, '_blank');
        }
    </script>
</body>
</html>
